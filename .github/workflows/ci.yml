name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64 -DAPP_VERSION=ci-${{ github.sha }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cmake --install build --config Release --prefix dist

      - uses: actions/upload-artifact@v7
        with:
          name: spout_stream-${{ github.sha }}
          path: dist/
          retention-days: 14
